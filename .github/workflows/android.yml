name: Android paketi

# android/ klasöründe değişiklik olunca Play paketi (.aab) ve deneme APK'sı derlenir.
# İmza için depo ayarlarında şu gizli değerler gerekir:
#   KEYSTORE_BASE64   signing.keystore dosyasının base64 hali
#   KEYSTORE_PASSWORD anahtar deposu şifresi
#   KEY_PASSWORD      (isteğe bağlı) anahtar şifresi, farklıysa
on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: İmza anahtarını hazırla
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/signing.keystore" >> "$GITHUB_ENV"
            echo "İmza anahtarı bulundu."
          else
            echo "::warning::İmza anahtarı yok, yalnızca deneme paketi derlenecek."
          fi

      - name: Derle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon assembleDebug bundleRelease

      - name: İmzayı doğrula
        if: env.KEYSTORE_FILE != ''
        run: keytool -printcert -jarfile app/build/outputs/bundle/release/app-release.aab | grep -i "SHA256:"

      - uses: actions/upload-artifact@v4
        with:
          name: lucky-ciftlik-paketleri
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/debug/*.apk
